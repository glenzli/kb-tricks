# dev-cycle artifact boundary config
#
# Copy to .dev-cycle/context/config.yaml in the target repository and adjust before
# running context-plan.

include:
  - dev_cycle/**
  - tools/**
  - skills/**
  - templates/**
  - spec/**
  - tests/**
  - README.md
  - AGENTS.md
  - ROADMAP.md
  - RELEASE.md
  - pyproject.toml
  - MANIFEST.in

exclude:
  - .git/**
  - .venv/**
  - __pycache__/**
  - "**/__pycache__/**"
  - "*.egg-info/**"
  - dist/**
  - build/**
  - out/**
  - node_modules/**
  - vendor/**

releaseExcluded:
  - .dev-cycle/**
  - AGENTS.md
  - skills/**
  - tests/**
  - templates/**
  - spec/**
  - tools/**

docs:
  existing:
    - README.md
    - AGENTS.md
    - ROADMAP.md
    - RELEASE.md
    - spec/**
    - skills/README.md
    - skills/REVIEW_PROTOCOL.md
