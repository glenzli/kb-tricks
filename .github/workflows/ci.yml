name: CI

on:
  push:
  pull_request:

jobs:
  release-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Source checkout smoke
        run: python -B tools/release_smoke.py

      - name: Install package
        run: python -m pip install .

      - name: Installed CLI smoke
        run: python -B tools/release_smoke.py --installed --skip-tests --skip-git-check
