# dev-cycle artifact boundary config
#
# Copy to .agent/kb/config.yaml in the target repository and adjust before
# running kb-plan.

include:
  - src/**
  - docs/dev/**

exclude:
  - dist/**
  - out/**
  - node_modules/**
  - vendor/**

releaseExcluded:
  - docs/dev/**
  - .agent/**

docs:
  existing:
    - README.md
    - docs/**
