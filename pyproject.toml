[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-cycle"
version = "0.1.0"
description = "Development lifecycle skills and deterministic checks for AI-assisted engineering."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "dev-cycle contributors" }
]

[project.scripts]
kb = "kb_tricks.cli:main"

[tool.setuptools.packages.find]
include = ["kb_tricks", "kb_tricks.*"]

[tool.setuptools.package-data]
kb_tricks = ["templates/*"]
