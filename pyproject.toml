[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-tricks"
version = "0.1.0"
description = "Controllable, auditable AI development context tooling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "kb-tricks contributors" }
]

[project.scripts]
kb = "kb_tricks.cli:main"

[tool.setuptools.packages.find]
include = ["kb_tricks", "tools"]
