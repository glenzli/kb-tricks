# dev-cycle artifact boundary config
#
# Copy to .dev-cycle/context/config.yaml in the target repository and adjust before
# running context-plan.

include:
  - src/**
  - docs/dev/**

exclude:
  - dist/**
  - out/**
  - node_modules/**
  - vendor/**

releaseExcluded:
  - docs/dev/**
  - .dev-cycle/**

docs:
  existing:
    - README.md
    - docs/**
